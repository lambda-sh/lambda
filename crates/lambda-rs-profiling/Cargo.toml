[package]
name = "lambda-rs-profiling"
description = "Profiling support for lambda-rs"
version = "2023.1.30"
edition = "2021"
license = "MIT"
repository = "https://github.com/lambda-sh/lambda"

[lib]
name = "lambda_rs_profiling"
path = "src/lib.rs"

[dependencies]
lambda-rs-platform = { path = "../lambda-rs-platform", version = "2023.1.30", default-features = false }

[features]
default = []
gpu = []
export-summary = ["lambda-rs-platform/profiling-export-summary"]
export-trace = ["lambda-rs-platform/profiling-export-trace"]
